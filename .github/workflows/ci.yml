name: CI

on:
  push:
  pull_request:

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpcs

  javascript:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run build
      - name: Committed build/ matches the source
        run: git diff --exit-code -- build/
      - name: Playground blueprint is up to date with seed.php
        run: npm run blueprint && git diff --exit-code -- _playground/blueprint.json

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: [php-syntax, coding-standards, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run plugin-zip
      - uses: actions/upload-artifact@v4
        with:
          name: fieldnote-interactive
          path: fieldnote-interactive.zip
